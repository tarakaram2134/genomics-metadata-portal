[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-metadata-portal"
version = "0.1.0"
description = "Portfolio-grade bioinformatics metadata, provenance, and analysis portal built with PostgreSQL, Python, SQLAlchemy, and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Spartan" }
]
dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
